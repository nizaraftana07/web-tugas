<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TugasKuliah.id - Manajemen Tugas Kuliah</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Compiler for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Data Awal (Demo Tasks)
    const INITIAL_LOCAL_TASKS = [
      {
        id: 'demo-1',
        title: 'Laporan Praktikum Basis Data',
        course: 'Basis Data',
        lecturer: 'Dr. Ahmad Fauzi, M.T.',
        deadline: new Date(Date.now() + 86400000 * 2).toISOString().slice(0, 16),
        priority: 'High',
        description: 'Membuat query SQL kompleks untuk ERD Rumah Sakit dan laporan PDF.',
        status: 'Belum Selesai',
        createdAt: Date.now()
      },
      {
        id: 'demo-2',
        title: 'Makalah Etika Profesi Informatika',
        course: 'Etika Profesi',
        lecturer: 'Drs. Supriyadi, M.Kom',
        deadline: new Date(Date.now() + 86400000 * 5).toISOString().slice(0, 16),
        priority: 'Medium',
        description: 'Analisis kasus hak cipta perangkat lunak di Indonesia minimum 10 halaman.',
        status: 'Belum Selesai',
        createdAt: Date.now() - 10000
      },
      {
        id: 'demo-3',
        title: 'Kuis Web Development',
        course: 'Pemrograman Web',
        lecturer: 'Novi Fitriani, M.T.',
        deadline: new Date(Date.now() - 86400000 * 1).toISOString().slice(0, 16),
        priority: 'Low',
        description: 'Mengerjakan kuis online pilihan ganda materi HTML, CSS, & React JS.',
        status: 'Selesai',
        createdAt: Date.now() - 20000
      }
    ];

    function App() {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('tugas_kuliah_data');
        return saved ? JSON.parse(saved) : INITIAL_LOCAL_TASKS;
      });

      const [darkMode, setDarkMode] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCourse, setSelectedCourse] = useState('All');
      const [statusFilter, setStatusFilter] = useState('Semua');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);

      // Form State
      const [formData, setFormData] = useState({
        title: '',
        course: '',
        lecturer: '',
        deadline: '',
        priority: 'Medium',
        description: '',
        status: 'Belum Selesai'
      });

      // Sync to LocalStorage
      useEffect(() => {
        localStorage.setItem('tugas_kuliah_data', JSON.stringify(tasks));
      }, [tasks]);

      // Toggle Dark Mode
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Handle Lucide Icons render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [tasks, isModalOpen, darkMode]);

      // Extract unique courses
      const courses = useMemo(() => {
        const list = tasks.map(t => t.course).filter(Boolean);
        return ['All', ...new Set(list)];
      }, [tasks]);

      // Stats Calculation
      const stats = useMemo(() => {
        const total = tasks.length;
        const completed = tasks.filter(t => t.status === 'Selesai').length;
        const pending = total - completed;
        const urgent = tasks.filter(t => {
          if (t.status === 'Selesai') return false;
          const diffMs = new Date(t.deadline).getTime() - Date.now();
          return diffMs > 0 && diffMs <= 48 * 3600 * 1000;
        }).length;
        return { total, completed, pending, urgent };
      }, [tasks]);

      // Filtered Tasks
      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          const matchSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              t.course.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              t.lecturer.toLowerCase().includes(searchQuery.toLowerCase());
          const matchCourse = selectedCourse === 'All' || t.course === selectedCourse;
          const matchStatus = statusFilter === 'Semua' || 
                             (statusFilter === 'Selesai' && t.status === 'Selesai') ||
                             (statusFilter === 'Belum Selesai' && t.status === 'Belum Selesai');
          return matchSearch && matchCourse && matchStatus;
        });
      }, [tasks, searchQuery, selectedCourse, statusFilter]);

      const openModal = (task = null) => {
        if (task) {
          setEditingTask(task);
          setFormData({ ...task });
        } else {
          setEditingTask(null);
          setFormData({
            title: '',
            course: '',
            lecturer: '',
            deadline: new Date(Date.now() + 86400000).toISOString().slice(0, 16),
            priority: 'Medium',
            description: '',
            status: 'Belum Selesai'
          });
        }
        setIsModalOpen(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.course) return;

        if (editingTask) {
          setTasks(tasks.map(t => t.id === editingTask.id ? { ...formData, id: t.id } : t));
        } else {
          const newTask = {
            ...formData,
            id: 'task-' + Date.now(),
            createdAt: Date.now()
          };
          setTasks([newTask, ...tasks]);
        }
        setIsModalOpen(false);
      };

      const deleteTask = (id) => {
        if (confirm('Apakah Anda yakin ingin menghapus tugas ini?')) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const toggleStatus = (id) => {
        setTasks(tasks.map(t => {
          if (t.id === id) {
            return {
              ...t,
              status: t.status === 'Selesai' ? 'Belum Selesai' : 'Selesai'
            };
          }
          return t;
        }));
      };

      return (
        <div class="max-w-6xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
              <h1 class="text-3xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                🎓 TugasKuliah.id
              </h1>
              <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">
                Kelola tugas perkuliahan & deadline dengan lebih teratur
              </p>
            </div>
            <div class="flex items-center gap-3">
              <button 
                onClick={() => setDarkMode(!darkMode)}
                class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
                title="Toggle Dark Mode"
              >
                {darkMode ? '☀️' : '🌙'}
              </button>
              <button 
                onClick={() => openModal()}
                class="bg-sky-600 hover:bg-sky-700 text-white font-medium px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-sm transition"
              >
                <span>+</span> Tambah Tugas
              </button>
            </div>
          </header>

          {/* Stats Cards */}
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <p class="text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Tugas</p>
              <h3 class="text-2xl font-bold text-slate-800 dark:text-white mt-1">{stats.total}</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <p class="text-amber-600 dark:text-amber-400 text-xs font-semibold uppercase tracking-wider">Belum Selesai</p>
              <h3 class="text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{stats.pending}</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <p class="text-emerald-600 dark:text-emerald-400 text-xs font-semibold uppercase tracking-wider">Selesai</p>
              <h3 class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{stats.completed}</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
              <p class="text-rose-600 dark:text-rose-400 text-xs font-semibold uppercase tracking-wider">Mendesak (&lt;48 Jam)</p>
              <h3 class="text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1">{stats.urgent}</h3>
            </div>
          </div>

          {/* Controls / Filter */}
          <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
            <div class="relative flex-1">
              <input 
                type="text"
                placeholder="Cari judul tugas, mata kuliah, atau dosen..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                class="w-full bg-slate-100 dark:bg-slate-700/50 border border-transparent dark:border-slate-600 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
              />
            </div>

            <div class="flex flex-wrap gap-3 items-center">
              <select 
                value={selectedCourse} 
                onChange={(e) => setSelectedCourse(e.target.value)}
                class="bg-slate-100 dark:bg-slate-700/50 border border-transparent dark:border-slate-600 text-slate-700 dark:text-slate-200 text-sm rounded-xl px-3 py-2 focus:outline-none"
              >
                {courses.map(c => <option key={c} value={c}>{c === 'All' ? 'Semua Matkul' : c}</option>)}
              </select>

              <div class="flex bg-slate-100 dark:bg-slate-700/50 p-1 rounded-xl text-xs font-medium">
                {['Semua', 'Belum Selesai', 'Selesai'].map(st => (
                  <button
                    key={st}
                    onClick={() => setStatusFilter(st)}
                    class={`px-3 py-1.5 rounded-lg transition ${statusFilter === st ? 'bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}
                  >
                    {st}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Task Grid */}
          {filteredTasks.length === 0 ? (
            <div class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/60">
              <p class="text-slate-400 dark:text-slate-500 text-lg">Tidak ada tugas yang ditemukan.</p>
            </div>
          ) : (
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
              {filteredTasks.map(task => {
                const isDone = task.status === 'Selesai';
                const deadlineDate = new Date(task.deadline);
                const isOverdue = !isDone && deadlineDate.getTime() < Date.now();

                return (
                  <div 
                    key={task.id} 
                    class={`bg-white dark:bg-slate-800 rounded-2xl border ${isDone ? 'border-slate-200 dark:border-slate-700/40 opacity-75' : isOverdue ? 'border-rose-300 dark:border-rose-800/80' : 'border-slate-200/80 dark:border-slate-700/60'} p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between`}
                  >
                    <div>
                      <div class="flex justify-between items-start gap-2 mb-3">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 border border-sky-100 dark:border-sky-900">
                          {task.course}
                        </span>
                        <span class={`text-xs px-2 py-0.5 rounded font-medium ${
                          task.priority === 'High' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                          task.priority === 'Medium' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300' :
                          'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'
                        }`}>
                          {task.priority}
                        </span>
                      </div>

                      <h3 class={`font-bold text-slate-800 dark:text-white text-lg ${isDone ? 'line-through text-slate-400 dark:text-slate-500' : ''}`}>
                        {task.title}
                      </h3>
                      
                      {task.lecturer && (
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">👨‍🏫 {task.lecturer}</p>
                      )}

                      {task.description && (
                        <p class="text-sm text-slate-600 dark:text-slate-300 mt-3 line-clamp-2">
                          {task.description}
                        </p>
                      )}
                    </div>

                    <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-700/50">
                      <div class="flex items-center justify-between text-xs mb-3">
                        <span class="text-slate-500 dark:text-slate-400">Deadline:</span>
                        <span class={`font-semibold ${isOverdue ? 'text-rose-600 dark:text-rose-400' : 'text-slate-700 dark:text-slate-300'}`}>
                          {deadlineDate.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}
                        </span>
                      </div>

                      <div class="flex items-center justify-between gap-2">
                        <button
                          onClick={() => toggleStatus(task.id)}
                          class={`flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition ${
                            isDone 
                              ? 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300' 
                              : 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800'
                          }`}
                        >
                          {isDone ? '✓ Selesai' : 'Tandai Selesai'}
                        </button>

                        <button 
                          onClick={() => openModal(task)}
                          class="p-1.5 text-slate-500 hover:text-sky-600 dark:text-slate-400 dark:hover:text-sky-400"
                        >
                          ✏️
                        </button>

                        <button 
                          onClick={() => deleteTask(task.id)}
                          class="p-1.5 text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Modal Form */}
          {isModalOpen && (
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl p-6 shadow-xl border border-slate-200 dark:border-slate-700">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white mb-4">
                  {editingTask ? 'Edit Tugas' : 'Tambah Tugas Baru'}
                </h2>
                
                <form onSubmit={handleSubmit} class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Judul Tugas *</label>
                    <input 
                      type="text" 
                      required
                      value={formData.title}
                      onChange={e => setFormData({...formData, title: e.target.value})}
                      placeholder="Contoh: Laporan Praktikum Web"
                      class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Mata Kuliah *</label>
                      <input 
                        type="text" 
                        required
                        value={formData.course}
                        onChange={e => setFormData({...formData, course: e.target.value})}
                        placeholder="Pemrograman Web"
                        class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Dosen Pengampu</label>
                      <input 
                        type="text" 
                        value={formData.lecturer}
                        onChange={e => setFormData({...formData, lecturer: e.target.value})}
                        placeholder="Nama Dosen"
                        class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                      />
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Deadline *</label>
                      <input 
                        type="datetime-local" 
                        required
                        value={formData.deadline}
                        onChange={e => setFormData({...formData, deadline: e.target.value})}
                        class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Prioritas</label>
                      <select 
                        value={formData.priority}
                        onChange={e => setFormData({...formData, priority: e.target.value})}
                        class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Catatan / Deskripsi</label>
                    <textarea 
                      rows="3"
                      value={formData.description}
                      onChange={e => setFormData({...formData, description: e.target.value})}
                      placeholder="Detail tugas atau catatan tambahan..."
                      class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-sky-500 dark:text-white"
                    ></textarea>
                  </div>

                  <div class="flex justify-end gap-3 pt-3">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit"
                      class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium shadow-sm"
                    >
                      Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
